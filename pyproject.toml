[project]
name = "meqsum"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Desire", email = "soussoudesire2019@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "evaluate>=0.4.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.9.1",
    "sentencepiece>=0.2.2",
    "transformers>=5.19.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
